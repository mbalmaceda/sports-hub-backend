# fly.toml app configuration file generated for sports-hub-backend on 2026-07-18T03:59:46Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sports-hub-backend'
primary_region = 'gru'

[build]
  [build.args]
    GO_VERSION = '1.26.4'

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
